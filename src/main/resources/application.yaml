server:
  port: 8080

spring:
  # 真实密钥放在项目根目录的 application-local.yaml（不进 jar、不进 git）
  # 这里不写 optional:，文件缺失就启动失败 —— 快速失败远好过静默 401
  config:
    import: file:./application-local.yaml

  datasource:
    # 文件模式(持久化,重启数据保留)
    url: jdbc:duckdb:./data/app.duckdb
    # 内存模式(程序退出数据即丢失):url: jdbc:duckdb:
    driver-class-name: org.duckdb.DuckDBDriver
    username: ""
    password: ""
    # DuckDB 是嵌入式单写者引擎,连接池不宜开大
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1

  ai:
    openai:
      # api-key / base-url 属于环境相关配置，放在 application-local.yaml，不进版本库
      chat:
        options:
          # 与 Codex config.toml 的 model 保持一致：gpt-6-luna（不是 gpt-6.1-luna）
          model: gpt-6-luna
          temperature: 0

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true
  global-config:
    # 全局配置
    db-config:
      # 数据库配置
      id-type: auto

# 链路追踪：请求开始时 GraphRunner 把 traceId 放进 MDC，
# 同一轮问答里所有节点日志会自动带上同一个 ID，grep 该 ID 即可还原完整链路。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.gdou: INFO
    # 排障时把 com.gdou 调成 DEBUG，可额外看到模型返回原文、DDL 查询语句与白名单明细