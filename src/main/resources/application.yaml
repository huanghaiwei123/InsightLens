server:
  port: 8080

spring:
  # insightlens.home 由 Electron 启动时通过 -D 传入，指向用户数据目录；
  # 本地开发不传时用默认值 .（项目根目录），行为与改造前一致。
  # 真实密钥放在 application-local.yaml（不进 jar、不进 git）
  # 这里不写 optional:，文件缺失就启动失败 —— 快速失败远好过静默 401
  config:
    import: file:${insightlens.home:.}/application-local.yaml

  # 首次启动（尤其 Electron 全新 userData）自动建表：InsightLens.sql 全部是
  # CREATE ... IF NOT EXISTS / ADD COLUMN IF NOT EXISTS，重复执行幂等。
  # 不配这项时空白库没有任何业务表，报表接口直接 500。
  sql:
    init:
      mode: always
      schema-locations: classpath:InsightLens.sql
      continue-on-error: false

  datasource:
    # 文件模式(持久化,重启数据保留)
    # 打包后数据库必须放用户数据目录，否则写不进 Program Files
    url: jdbc:duckdb:${insightlens.home:.}/data/app.duckdb
    # 内存模式(程序退出数据即丢失):url: jdbc:duckdb:
    driver-class-name: org.duckdb.DuckDBDriver
    username: ""
    password: ""
    # DuckDB 是嵌入式单写者引擎,连接池不宜开大
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1


  ai:
    openai:
      # api-key / base-url 属于环境相关配置，放在 application-local.yaml，不进版本库
      chat:
        options:
          # 与 Codex config.toml 的 model 保持一致：gpt-6-luna（不是 gpt-6.1-luna）
          model: gpt-6-luna
          temperature: 0
          # 关闭并行工具调用。第三方 OpenAI 兼容中转在流式返回 tool_call 时，
          # 若某个分片既没有 id 也没有 function，Spring AI 的
          # OpenAiStreamFunctionCallingHelper.merge 会在 current.name() 上抛 NPE
          # （该方法只判了 previous == null，没判 current，1.1.8 仍未修），
          # 整个流被 MessageAggregator 中断，前端只看到「本轮处理失败」。
          # 一次只让模型用一个工具，能显著降低碰上不规范分片的概率。
          parallel-tool-calls: false
    mcp:
      client:
        # 恒为 false：不启用 Spring AI 的自动装配，改由 McpSearchConfig 手动创建客户端。
        # 原因：auto-config 在上下文刷新时同步 initialize，握手超时用的是 MCP SDK 硬编码的
        # initializationTimeout=20s，而 Spring AI 1.1.2 只暴露了 requestTimeout，改不动它。
        # open-websearch 冷加载 6000+ 文件实测 16-25s，必然 TimeoutException 把整个
        # ApplicationContext 拖挂 —— 表现就是「insightlens.mcp.enabled 改成 true 后启动超时」。
        # McpSearchConfig 把握手超时放宽到 60s，且初始化失败只降级、不抛异常。
        #
        # 联网开关本身仍是 insightlens.mcp.enabled：Electron 通过 -D 传，
        # 开发态可以 INSIGHTLENS_MCP_ENABLED=true mvn spring-boot:run，
        # 入口脚本路径由 McpSearchGuard 自动探测 frontend/runtime 下的预置包。
        enabled: false
        # 注意：request-timeout 只管「连接建立之后的调用」。initialize 握手用的是
        # MCP Java SDK 自己的 initializationTimeout，默认 20 秒且 Spring AI 1.1.2
        # 没把它暴露成配置项 —— 这里写 60s 也改不了那个 20s 硬上限。
        # 应对办法在 Electron 侧：起后端之前先预热一次 open-websearch
        # （main.cjs 的 warmUpWebSearch），热态下实测握手 0.15–4 秒。
        # 下面 request-timeout 与 stdio.connections 已不生效（自动装配被上面关掉了），
        # 仅作文档保留：真实装配参数在 McpSearchConfig —— 60s 握手超时、60s 调用超时、
        # 以及 MODE / DEFAULT_SEARCH_ENGINE / ALLOWED_SEARCH_ENGINES 三个环境变量。
        request-timeout: 60s
        # ==== 方案 A：本地 stdio（中文引擎，无需 key） ====
        # open-websearch（Aas-ee/open-webSearch，Apache-2.0）不是搜索 API：
        # 它在本机起一个 Node 进程，抓百度/搜狗/Bing 的结果页再解析成 JSON，
        # 所以零 key、零配额；代价是引擎改版会失效、高频会吃验证码。
        #
        # 运行时由 frontend/scripts/prepare-runtime.mjs 预置（幂等执行）：
        #   runtime/node/node.exe                        ← 随应用分发的 Node
        #   runtime/mcp/node_modules/open-websearch/...  ← 预装好的包（含依赖）
        # Electron 启动时用 -Dinsightlens.mcp.node / -Dinsightlens.mcp.websearch-script
        # 把两个绝对路径传进来。不走 npx：它每次启动多花约 5 秒解析包，
        # 还要求目标机器自己装了 Node。
        #
        # 注意：MCP 初始化失败是「启动致命」而不是降级 —— Spring AI 的
        # toolCallbackResolver 在启动期就要拿到工具列表，拿不到整个 context 就崩，
        # ReActAgentRunner 上的 required=false 救不了。因此下面两个占位符的默认值
        # 故意留成「文件不存在」：McpSearchGuard 发现入口缺失时会直接把
        # spring.ai.mcp.client.enabled 压成 false，应用照常启动，只是没有联网搜索。
        stdio:
          connections:
            websearch:
              command: ${insightlens.mcp.node:node}
              # 单引号必须有：Windows 路径里全是反斜杠，双引号会被当转义字符
              args: ['${insightlens.mcp.websearch-script:}']
              env:
                MODE: stdio
                # 中文内容为主的场景用百度，比 bing 稳（bing 反爬最勤）
                DEFAULT_SEARCH_ENGINE: baidu
                ALLOWED_SEARCH_ENGINES: baidu,sogou,bing,csdn,juejin,duckduckgo
        # ==== 方案 B：远程 streamable-http（Exa，已停用） ====
        # 2026-11-27 实测可用：initialize 返回 200 + text/event-stream，
        # listTools() 拿到 web_search_exa / web_fetch_exa。
        # 但 SDK 在 initialize 之后会开一条 GET 长连接收服务端通知，Exa 对 GET 回 405，
        # SDK 0.14.0 把规范允许的拒绝打成整屏 WARN 堆栈（工具本身正常）。
        # 现在 open-websearch 已覆盖 bing/duckduckgo，Exa 边际价值低还拖慢启动约 1.5s，
        # 故停用。要恢复英文语义检索：取消下面四行注释即可（可与方案 A 同时开）。
        # 另：Tavily 不要加回来，它的 /mcp 已改成 OAuth 2.0 保护资源（返回 401），
        # 老的 ?tavilyApiKey=xxx 传参作废，Spring AI 1.1.2 的连接参数也配不了 header。
        # streamable-http:
        #   connections:
        #     exa:
        #       url: https://mcp.exa.ai


  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB


mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true
  global-config:
    # 全局配置
    db-config:
      # 数据库配置
      id-type: auto

# 链路追踪：请求开始时 GraphRunner 把 traceId 放进 MDC，
# 同一轮问答里所有节点日志会自动带上同一个 ID，grep 该 ID 即可还原完整链路。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.gdou: INFO
    # 排障时把 com.gdou 调成 DEBUG，可额外看到模型返回原文、DDL 查询语句与白名单明细

agent:
  # 上传文件根目录：Electron 打包后 = insightlens.home/data/excel
  workspace: ${insightlens.home:.}/data/excel
