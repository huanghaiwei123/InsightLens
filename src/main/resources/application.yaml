server:
  port: 8080

spring:
  # insightlens.home 由 Electron 启动时通过 -D 传入，指向用户数据目录；
  # 本地开发不传时用默认值 .（项目根目录），行为与改造前一致。
  # 真实密钥放在 application-local.yaml（不进 jar、不进 git）
  # 这里不写 optional:，文件缺失就启动失败 —— 快速失败远好过静默 401
  config:
    import: file:${insightlens.home:.}/application-local.yaml

  datasource:
    # 文件模式(持久化,重启数据保留)
    # 打包后数据库必须放用户数据目录，否则写不进 Program Files
    url: jdbc:duckdb:${insightlens.home:.}/data/app.duckdb
    # 内存模式(程序退出数据即丢失):url: jdbc:duckdb:
    driver-class-name: org.duckdb.DuckDBDriver
    username: ""
    password: ""
    # DuckDB 是嵌入式单写者引擎,连接池不宜开大
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1


  ai:
    openai:
      # api-key / base-url 属于环境相关配置，放在 application-local.yaml，不进版本库
      chat:
        options:
          # 与 Codex config.toml 的 model 保持一致：gpt-6-luna（不是 gpt-6.1-luna）
          model: gpt-6-luna
          temperature: 0
    mcp:
      client:
        # Exa / Tavily 官方端点都是 Streamable HTTP（POST /mcp），不是旧版 SSE。
        # 配成 sse.connections 时框架会自动拼 /sse，请求 /mcp/sse 直接 404。
        # 注意：url 只写到域名，框架会自动拼 endpoint（默认 /mcp），别把路径重复写进去。
        streamable-http:
          connections:
            # Exa keyless：裸 URL 即可用，免费限流，无需注册或 API key
            exa:
              url: https://mcp.exa.ai
            # Tavily 用 API key：Spring AI 1.1.2 的 MCP 连接参数配不了 header，
            # 官方支持把 key 放 URL 参数，占位符从 application-local.yaml（不进 git）读取。
            # keyless 模式需 X-Tavily-Access-Mode header，本版本配不了，故不用。
            tavily:
              url: https://mcp.tavily.com
              endpoint: /mcp/?tavilyApiKey=${tavily.api-key}


  servlet:
    multipart:
      max-file-size: 1KB

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true
  global-config:
    # 全局配置
    db-config:
      # 数据库配置
      id-type: auto

# 链路追踪：请求开始时 GraphRunner 把 traceId 放进 MDC，
# 同一轮问答里所有节点日志会自动带上同一个 ID，grep 该 ID 即可还原完整链路。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.gdou: INFO
    # 排障时把 com.gdou 调成 DEBUG，可额外看到模型返回原文、DDL 查询语句与白名单明细

agent:
  # 上传文件根目录：Electron 打包后 = insightlens.home/data/excel
  workspace: ${insightlens.home:.}/data/excel
